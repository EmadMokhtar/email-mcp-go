<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img">
  <title>The three parts of email-mcp</title>
  <desc>The AI app starts email-mcp. email-mcp talks to the mail server. The person uses the web pages of email-mcp.</desc>

  <rect class="d-box" x="24" y="24" width="160" height="56" rx="8"/>
  <text class="d-text" x="104" y="52" text-anchor="middle" dominant-baseline="central">AI app</text>

  <rect class="d-box d-go" x="280" y="24" width="160" height="56" rx="8"/>
  <text class="d-text" x="360" y="52" text-anchor="middle" dominant-baseline="central">email-mcp</text>

  <rect class="d-box" x="536" y="24" width="160" height="56" rx="8"/>
  <text class="d-text" x="616" y="52" text-anchor="middle" dominant-baseline="central">Mail server</text>

  <path class="d-line" d="M184 52H280M272 46L280 52L272 58"/>
  <text class="d-soft" x="232" y="38" text-anchor="middle">starts</text>

  <path class="d-line" d="M440 52H536M528 46L536 52L528 58"/>
  <text class="d-soft" x="488" y="38" text-anchor="middle">talks to</text>

  <path class="d-line" d="M360 144V80M354 88L360 80L366 88"/>
  <text class="d-soft" x="376" y="116">web pages</text>

  <rect class="d-box" x="280" y="144" width="160" height="40" rx="8"/>
  <text class="d-text" x="360" y="164" text-anchor="middle" dominant-baseline="central">Person</text>
</svg>

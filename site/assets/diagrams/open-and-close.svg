<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" role="img">
  <title>The order of Open and Close</title>
  <desc>Two lists side by side. On the left, app.Open builds the parts in six steps: 1, the default logger, a text log on standard error. 2, the store, with its migrations and the local tenant. 3, the master key and the vault: loadKEK runs under a lock, and the first start makes the key. 4, the signer, with a key derived from the server key. 5, the other parts: the limiter, the confirm manager, the backend factory, the outbox, which comes after the backend factory because its sender uses it, the audit log, the tokens and the discovery. 6, the web server first, then the service with the links of the web server, then Attach closes the loop. After Open, App.Run recovers interrupted sends, expires stale approvals, and starts the outbox worker, the daily jobs and the sweep of idle backends. On the right, App.Close stops them in six steps, within the budget StopTimeout. 1, BeginStop: no send, Trash move, approval or tool call can start. This does not wait. 2, stop the work of Run and wait for it: the send in progress finishes and writes its result. This waits and does not stop at the deadline. 3, wait for the tool calls and the service actions that run. This waits and does not stop at the deadline. 4, Outbox.Drain for up to drainWait, 5 minutes: it sends the queued messages that are due, and it stops at the deadline. 5, shut down the web server. 6, close the mail backends and the store. StopTimeout is drainWait, 5 minutes, plus SendDeadline, 13 minutes, plus 2 minutes: 20 minutes.</desc>

  <!-- This file is the source of the drawing: edit it by hand. A short script
       placed the first coordinates, and that script is not kept. The
       classes are in site/assets/css/site.css. -->

  <text class="d-text" x="185" y="22" text-anchor="middle" dominant-baseline="central">Open: app.Open</text>
  <text class="d-text" x="535" y="22" text-anchor="middle" dominant-baseline="central">Close: App.Close</text>
  <rect class="d-box" x="20" y="44" width="330" height="64" rx="8"/>
  <text class="d-text" x="185" y="67.5" text-anchor="middle" dominant-baseline="central">1 The logger</text>
  <text class="d-soft" x="185" y="84.5" text-anchor="middle" dominant-baseline="central">the default logger: text, to standard error</text>
  <rect class="d-box" x="20" y="128" width="330" height="64" rx="8"/>
  <text class="d-text" x="185" y="151.5" text-anchor="middle" dominant-baseline="central">2 The store</text>
  <text class="d-soft" x="185" y="168.5" text-anchor="middle" dominant-baseline="central">store.Open: migrations, the local tenant</text>
  <rect class="d-box" x="20" y="212" width="330" height="64" rx="8"/>
  <text class="d-text" x="185" y="235.5" text-anchor="middle" dominant-baseline="central">3 The master key and the vault</text>
  <text class="d-soft" x="185" y="252.5" text-anchor="middle" dominant-baseline="central">loadKEK under a lock; the first start makes the key</text>
  <rect class="d-box" x="20" y="296" width="330" height="64" rx="8"/>
  <text class="d-text" x="185" y="319.5" text-anchor="middle" dominant-baseline="central">4 The signer</text>
  <text class="d-soft" x="185" y="336.5" text-anchor="middle" dominant-baseline="central">its key is derived from the server key</text>
  <rect class="d-box" x="20" y="380" width="330" height="64" rx="8"/>
  <text class="d-text" x="185" y="395" text-anchor="middle" dominant-baseline="central">5 The other parts</text>
  <text class="d-soft" x="185" y="412" text-anchor="middle" dominant-baseline="central">limiter, confirm manager, backend factory,</text>
  <text class="d-soft" x="185" y="429" text-anchor="middle" dominant-baseline="central">outbox, audit log, tokens, discovery</text>
  <rect class="d-box" x="20" y="464" width="330" height="64" rx="8"/>
  <text class="d-text" x="185" y="479" text-anchor="middle" dominant-baseline="central">6 The web server, then the service</text>
  <text class="d-soft" x="185" y="496" text-anchor="middle" dominant-baseline="central">the service gets the links of the web</text>
  <text class="d-soft" x="185" y="513" text-anchor="middle" dominant-baseline="central">server; Attach closes the loop</text>
  <rect class="d-box" x="370" y="44" width="330" height="64" rx="8"/>
  <text class="d-text" x="535" y="59" text-anchor="middle" dominant-baseline="central">1 BeginStop</text>
  <text class="d-soft" x="535" y="76" text-anchor="middle" dominant-baseline="central">no send, Trash move, approval or tool call</text>
  <text class="d-soft" x="535" y="93" text-anchor="middle" dominant-baseline="central">can start. This step does not wait</text>
  <rect class="d-box d-warn" x="370" y="128" width="330" height="64" rx="8"/>
  <text class="d-text" x="535" y="143" text-anchor="middle" dominant-baseline="central">2 Stop the work of Run</text>
  <text class="d-soft" x="535" y="160" text-anchor="middle" dominant-baseline="central">the send in progress finishes and writes its result</text>
  <text class="d-soft" x="535" y="177" text-anchor="middle" dominant-baseline="central">waits, and ignores the deadline</text>
  <rect class="d-box d-warn" x="370" y="212" width="330" height="64" rx="8"/>
  <text class="d-text" x="535" y="227" text-anchor="middle" dominant-baseline="central">3 Wait for calls and actions</text>
  <text class="d-soft" x="535" y="244" text-anchor="middle" dominant-baseline="central">tool calls and service actions that run</text>
  <text class="d-soft" x="535" y="261" text-anchor="middle" dominant-baseline="central">waits, and ignores the deadline</text>
  <rect class="d-box d-warn" x="370" y="296" width="330" height="64" rx="8"/>
  <text class="d-text" x="535" y="311" text-anchor="middle" dominant-baseline="central">4 Outbox.Drain</text>
  <text class="d-soft" x="535" y="328" text-anchor="middle" dominant-baseline="central">sends the messages due within drainWait (5 minutes)</text>
  <text class="d-soft" x="535" y="345" text-anchor="middle" dominant-baseline="central">waits, and stops at the deadline</text>
  <rect class="d-box" x="370" y="380" width="330" height="64" rx="8"/>
  <text class="d-text" x="535" y="403.5" text-anchor="middle" dominant-baseline="central">5 Shut down the web server</text>
  <text class="d-soft" x="535" y="420.5" text-anchor="middle" dominant-baseline="central">it stays up in step 4: the person can reject</text>
  <rect class="d-box" x="370" y="464" width="330" height="64" rx="8"/>
  <text class="d-text" x="535" y="496" text-anchor="middle" dominant-baseline="central">6 Close the backends and the store</text>
  <path class="d-line" d="M185 108V128M179 120L185 128L191 120"/>
  <path class="d-line" d="M535 108V128M529 120L535 128L541 120"/>
  <path class="d-line" d="M185 192V212M179 204L185 212L191 204"/>
  <path class="d-line" d="M535 192V212M529 204L535 212L541 204"/>
  <path class="d-line" d="M185 276V296M179 288L185 296L191 288"/>
  <path class="d-line" d="M535 276V296M529 288L535 296L541 288"/>
  <path class="d-line" d="M185 360V380M179 372L185 380L191 372"/>
  <path class="d-line" d="M535 360V380M529 372L535 380L541 372"/>
  <path class="d-line" d="M185 444V464M179 456L185 464L191 456"/>
  <path class="d-line" d="M535 444V464M529 456L535 464L541 456"/>
  <path class="d-line" d="M185 528V548M179 540L185 548L191 540"/>
  <rect class="d-box d-dash" x="20" y="548" width="330" height="56" rx="8"/>
  <text class="d-text" x="185" y="560" text-anchor="middle" dominant-baseline="central">Then App.Run</text>
  <text class="d-soft" x="185" y="576" text-anchor="middle" dominant-baseline="central">recover, expire, start the outbox worker,</text>
  <text class="d-soft" x="185" y="592" text-anchor="middle" dominant-baseline="central">the daily jobs and the backend sweep</text>
  <rect class="d-box" x="370" y="548" width="330" height="56" rx="8"/>
  <text class="d-text" x="535" y="567.5" text-anchor="middle" dominant-baseline="central">Budget: StopTimeout, 20 minutes</text>
  <text class="d-soft" x="535" y="584.5" text-anchor="middle" dominant-baseline="central">drainWait (5) + SendDeadline (13) + 2 minutes</text>
  <text class="d-soft" x="535" y="622" text-anchor="middle" dominant-baseline="central">The boxes that say waits wait for work that has started.</text>
</svg>

  <rect class="d-box" x="88" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="129" y="40" text-anchor="middle" dominant-baseline="central">Transport</text>
  <rect class="d-box" x="174" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="215" y="31" text-anchor="middle" dominant-baseline="central">SDK</text>
  <text class="d-text" x="215" y="49" text-anchor="middle" dominant-baseline="central">middleware</text>
  <rect class="d-box" x="260" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="301" y="40" text-anchor="middle" dominant-baseline="central">mcpserver</text>
  <rect class="d-box" x="346" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="387" y="40" text-anchor="middle" dominant-baseline="central">service</text>
  <rect class="d-box" x="432" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="473" y="31" text-anchor="middle" dominant-baseline="central">Backend</text>
  <text class="d-text" x="473" y="49" text-anchor="middle" dominant-baseline="central">cache</text>
  <rect class="d-box" x="518" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="559" y="40" text-anchor="middle" dominant-baseline="central">imapsmtp</text>
  <rect class="d-box" x="604" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="645" y="31" text-anchor="middle" dominant-baseline="central">IMAP</text>
  <text class="d-text" x="645" y="49" text-anchor="middle" dominant-baseline="central">server</text>
  <rect class="d-box" x="690" y="16" width="82" height="48" rx="8"/>
  <text class="d-text" x="731" y="31" text-anchor="middle" dominant-baseline="central">Audit</text>
  <text class="d-text" x="731" y="49" text-anchor="middle" dominant-baseline="central">log</text>

  <path class="d-line" d="M43 90H129M121 84L129 90L121 96"/>
  <text class="d-soft" x="86" y="80" text-anchor="middle">1 tools/call</text>
  <rect class="d-box d-dash" x="51" y="110" width="156" height="63" rx="8"/>
  <text class="d-text" x="129" y="124" text-anchor="middle" dominant-baseline="central">1 HTTP only</text>
  <text class="d-soft" x="129" y="141" text-anchor="middle" dominant-baseline="central">limit, Host, Origin,</text>
  <text class="d-soft" x="129" y="158" text-anchor="middle" dominant-baseline="central">body size, token</text>
  <path class="d-line" d="M129 199H215M207 193L215 199L207 205"/>
  <rect class="d-box" x="140" y="219" width="150" height="80" rx="8"/>
  <text class="d-text" x="215" y="233" text-anchor="middle" dominant-baseline="central">2 middleware</text>
  <text class="d-soft" x="215" y="250" text-anchor="middle" dominant-baseline="central">trackToolCalls</text>
  <text class="d-soft" x="215" y="267" text-anchor="middle" dominant-baseline="central">capture</text>
  <text class="d-soft" x="215" y="284" text-anchor="middle" dominant-baseline="central">schema check</text>
  <path class="d-line" d="M215 325H301M293 319L301 325L293 331"/>
  <rect class="d-box" x="226" y="345" width="150" height="63" rx="8"/>

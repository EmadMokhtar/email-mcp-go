  <text class="d-soft" x="301" y="376" text-anchor="middle" dominant-baseline="central">finds the principal</text>
  <text class="d-soft" x="301" y="393" text-anchor="middle" dominant-baseline="central">4 getMessage</text>
  <path class="d-line" d="M301 434H387M379 428L387 434L379 440"/>
  <rect class="d-box" x="312" y="454" width="150" height="63" rx="8"/>
  <text class="d-text" x="387" y="468" text-anchor="middle" dominant-baseline="central">5 authorize</text>
  <text class="d-soft" x="387" y="485" text-anchor="middle" dominant-baseline="central">account of the tenant</text>
  <text class="d-soft" x="387" y="502" text-anchor="middle" dominant-baseline="central">policy.Decide</text>
  <path class="d-line" d="M387 543H473M465 537L473 543L465 549"/>
  <rect class="d-box" x="398" y="563" width="150" height="63" rx="8"/>
  <text class="d-text" x="473" y="577" text-anchor="middle" dominant-baseline="central">6 BackendCache</text>
  <text class="d-soft" x="473" y="594" text-anchor="middle" dominant-baseline="central">Mail: cached, or</text>
  <text class="d-soft" x="473" y="611" text-anchor="middle" dominant-baseline="central">built again</text>
  <path class="d-line" d="M387 652H559M551 646L559 652L551 658"/>
  <text class="d-soft" x="473" y="642" text-anchor="middle">7 GetMessage</text>
  <path class="d-line" d="M559 684H645M637 678L645 684L637 690"/>
  <text class="d-soft" x="602" y="674" text-anchor="middle">EXAMINE</text>
  <path class="d-line" d="M559 716H645M637 710L645 716L637 722"/>
  <text class="d-soft" x="602" y="706" text-anchor="middle">BODY.PEEK</text>
  <path class="d-line" d="M645 748H559M567 742L559 748L567 754"/>
  <text class="d-soft" x="602" y="738" text-anchor="middle">data</text>
  <rect class="d-box" x="484" y="768" width="150" height="46" rx="8"/>
  <text class="d-text" x="559" y="782" text-anchor="middle" dominant-baseline="central">7 mime</text>
  <text class="d-soft" x="559" y="799" text-anchor="middle" dominant-baseline="central">decode, convert</text>
  <path class="d-line" d="M559 840H387M395 834L387 840L395 846"/>
  <text class="d-soft" x="473" y="830" text-anchor="middle">*mail.Message</text>
  <rect class="d-box" x="312" y="860" width="150" height="46" rx="8"/>
  <text class="d-text" x="387" y="874" text-anchor="middle" dominant-baseline="central">8 service</text>
  <text class="d-soft" x="387" y="891" text-anchor="middle" dominant-baseline="central">noteBackendError</text>
  <path class="d-line" d="M387 932H301M309 926L301 932L309 938"/>
  <rect class="d-box" x="226" y="952" width="150" height="63" rx="8"/>
  <text class="d-text" x="301" y="966" text-anchor="middle" dominant-baseline="central">9 messageOut</text>
  <text class="d-soft" x="301" y="983" text-anchor="middle" dominant-baseline="central">CleanUntrusted,</text>
  <text class="d-soft" x="301" y="1000" text-anchor="middle" dominant-baseline="central">Untrusted wrapper</text>
  <path class="d-line" d="M301 1041H215M223 1035L215 1041L223 1047"/>
  <path class="d-line" d="M215 1073H731M723 1067L731 1073L723 1079"/>
  <text class="d-soft" x="688" y="1063" text-anchor="middle">10 call entry</text>
  <path class="d-line" d="M215 1105H43M51 1099L43 1105L51 1111"/>
  <text class="d-soft" x="86" y="1095" text-anchor="middle">result</text>

  <text class="d-soft" x="2" y="1153">Numbers are the steps in the text. Dashed box: only on HTTP.</text>
</svg>

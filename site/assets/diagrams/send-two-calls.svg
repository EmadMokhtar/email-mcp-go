<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 657" role="img">
  <title>The two calls of an in-band question</title>
  <desc>A sequence of the in-band question, with five lanes: the person, the AI app that is the client, mcpserver, service, and confirm with the store. First call: 1, the client calls send_message. 2, mcpserver calls Send in band. 3, service calls Create in confirm, which stores the payload and the preview, sealed, as a pending action. 4, service returns NeedsConfirmation to mcpserver. 5, mcpserver returns to the client a result with the input request confirm and the RequestState, and no content. 6, the client shows the person a form with the preview. 7, the person accepts. Second call: 8, the client calls send_message again with the same arguments, the answer and the RequestState. 9, mcpserver calls Send with the answer. 10, service calls Resume and Claim in confirm, which move the action from pending to approved. 11, service builds the message again, compares it with the preview, and delivers it. 12, service returns the result to mcpserver. 13, mcpserver returns the status and the send id to the client.</desc>

  <!-- This file is the source of the drawing: edit it by hand. A short script
       placed the first coordinates, and that script is not kept. The
       classes are in site/assets/css/site.css. -->

  <rect class="d-box" x="20" y="16" width="130" height="48" rx="8"/>
  <text class="d-text" x="85" y="40" text-anchor="middle" dominant-baseline="central">Person</text>
  <rect class="d-box" x="170" y="16" width="130" height="48" rx="8"/>
  <text class="d-text" x="235" y="31.5" text-anchor="middle" dominant-baseline="central">AI app</text>
  <text class="d-soft" x="235" y="48.5" text-anchor="middle" dominant-baseline="central">(the client)</text>
  <rect class="d-box" x="320" y="16" width="130" height="48" rx="8"/>
  <text class="d-text" x="385" y="40" text-anchor="middle" dominant-baseline="central">mcpserver</text>
  <rect class="d-box" x="470" y="16" width="130" height="48" rx="8"/>
  <text class="d-text" x="535" y="40" text-anchor="middle" dominant-baseline="central">service</text>
  <rect class="d-box" x="620" y="16" width="130" height="48" rx="8"/>
  <text class="d-text" x="685" y="31.5" text-anchor="middle" dominant-baseline="central">confirm</text>
  <text class="d-soft" x="685" y="48.5" text-anchor="middle" dominant-baseline="central">and store</text>
  <path class="d-line" d="M85 64V641"/>
  <path class="d-line" d="M235 64V641"/>
  <path class="d-line" d="M385 64V641"/>
  <path class="d-line" d="M535 64V641"/>
  <path class="d-line" d="M685 64V641"/>
  <path class="d-line" d="M235 94H385M377 88L385 94L377 100"/>
  <text class="d-soft" x="310" y="84" text-anchor="middle">1 send_message (first call)</text>
  <path class="d-line" d="M385 134H535M527 128L535 134L527 140"/>
  <text class="d-soft" x="460" y="124" text-anchor="middle">2 Send, in band</text>
  <path class="d-line" d="M535 174H685M677 168L685 174L677 180"/>
  <text class="d-soft" x="610" y="164" text-anchor="middle">3 Create: payload and preview sealed</text>
  <path class="d-line" d="M535 214H385M393 208L385 214L393 220"/>
  <text class="d-soft" x="460" y="204" text-anchor="middle">4 NeedsConfirmation</text>
  <path class="d-line" d="M385 254H235M243 248L235 254L243 260"/>
  <text class="d-soft" x="310" y="244" text-anchor="middle">5 input request confirm + RequestState</text>
  <path class="d-line" d="M235 294H85M93 288L85 294L93 300"/>
  <text class="d-soft" x="160" y="284" text-anchor="middle">6 form with the preview</text>
  <path class="d-line" d="M85 334H235M227 328L235 334L227 340"/>
  <text class="d-soft" x="160" y="324" text-anchor="middle">7 the person accepts</text>
  <path class="d-line" d="M235 374H385M377 368L385 374L377 380"/>
  <text class="d-soft" x="310" y="364" text-anchor="middle">8 send_message again: answer + state</text>
  <path class="d-line" d="M385 414H535M527 408L535 414L527 420"/>
  <text class="d-soft" x="460" y="404" text-anchor="middle">9 Send with the answer</text>
  <path class="d-line" d="M535 454H685M677 448L685 454L677 460"/>
  <text class="d-soft" x="610" y="444" text-anchor="middle">10 Resume, Claim: pending to approved</text>
  <rect class="d-box" x="440" y="482" width="190" height="63" rx="8"/>
  <text class="d-text" x="535" y="496.5" text-anchor="middle" dominant-baseline="central">11 service</text>
  <text class="d-soft" x="535" y="513.5" text-anchor="middle" dominant-baseline="central">build again, samePreview,</text>
  <text class="d-soft" x="535" y="530.5" text-anchor="middle" dominant-baseline="central">deliver (Outbox.Enqueue)</text>
  <path class="d-line" d="M535 571H385M393 565L385 571L393 577"/>
  <text class="d-soft" x="460" y="561" text-anchor="middle">12 SendResult</text>
  <path class="d-line" d="M385 611H235M243 605L235 611L243 617"/>
  <text class="d-soft" x="310" y="601" text-anchor="middle">13 status, send_id</text>
</svg>

# Settings for the interop test. compose.yaml mounts this file last into
# conf.d, so it changes the settings of the image.

# IMAP for the test, LMTP for the mail that Postfix delivers.
protocols = imap lmtp

# The certificate made by test/interop/gencerts. It is valid for localhost
# and 127.0.0.1.
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server {
  cert_file = /certs/server.crt
  key_file = /certs/server.key
}

# A password may be sent only over TLS. This is also the default.
auth_allow_cleartext = no

# The folders with SPECIAL-USE attributes (RFC 6154). They are made when the
# user logs in for the first time.
namespace inbox {
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

# Postfix checks SMTP passwords here (smtpd_sasl_type = dovecot), so the
# account has one login for IMAP and SMTP. The port is open only on the
# network of the containers.
service auth {
  inet_listener sasl {
    port = 31012
    type = auth
  }
}

# Postfix delivers to this port over LMTP. It is open only on the network of
# the containers.
service lmtp {
  inet_listener lmtp {
    port = 31025
  }
}

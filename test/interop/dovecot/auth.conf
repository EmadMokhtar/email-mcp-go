# The interop test account. This file replaces conf.d/auth.conf of the image,
# whose passdb lets any user name log in.
#
# There is one user. Its password comes from INTEROP_PASSWORD, which is set in
# compose.yaml. It is a test value: the interop test uses it too.

import_environment {
  INTEROP_PASSWORD = %{env:INTEROP_PASSWORD | default('{CRYPT}*')}
}

passdb static {
  password = %{env:INTEROP_PASSWORD}
  # Only this user name can log in. Any other name fails.
  username_filter = interop@example.test
}

# LMTP delivery looks the recipient up here. Postfix sends mail only for the
# test user (see postfix/main.cf).
userdb static {
  allow_all_users = yes
}

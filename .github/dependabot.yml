# Dependabot opens pull requests that update the dependencies (spec section
# 16.1). Once a week, with one grouped pull request per ecosystem, so there are
# few pull requests to review. A new version must be 7 days old before
# Dependabot offers it (cooldown), so a bad release has time to be found and
# pulled. Security updates do not wait: the cooldown applies only to version
# updates.
#
# Not covered here, so update them by hand:
#   - the moby/buildkit builder image in .github/workflows/release.yml
#     (driver-opts);
#   - the docker/buildkit-syft-scanner image in .goreleaser.yaml;
#   - the tool versions that "go run" uses (staticcheck, govulncheck,
#     GoReleaser) in the Makefile and the workflows;
#   - the versions that release.yml gives to two installer actions:
#     cosign-release (sigstore/cosign-installer) and syft-version
#     (anchore/sbom-action/download-syft). Dependabot updates the actions, not
#     these inputs;
#   - the golangci-lint version that ci.yml gives to golangci-lint-action;
#   - the release-please version in the "$schema" URL of
#     release-please-config.json. Keep it the same as the release-please
#     version inside googleapis/release-please-action (release-please.yml).
#     Dependabot updates the action, not this URL.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The Go modules are inside the released binary and image. The prefix
    # "fix" makes release-please count an update, also a security update, as
    # a fix: it then proposes a patch release that ships it. Without it,
    # Dependabot writes "build(deps):", which release-please leaves out.
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-modules:
        patterns:
          - "*"
    ignore:
      # The plan pins go-imap/v2 to exactly v2.0.0-beta.8 (see the global
      # constraints). Change it only on purpose, never through Dependabot.
      - dependency-name: github.com/emersion/go-imap/v2

  # The actions in .github/workflows, pinned by commit SHA. Dependabot updates
  # the SHA and the tag in the comment after it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # The base images of the Dockerfile of the release, and of the Postfix image
  # of the interop test.
  - package-ecosystem: docker
    directories:
      - /
      - /test/interop/postfix
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns:
          - "*"

  # The Dovecot image of the interop test (test/interop/compose.yaml). It is
  # written as tag@digest, so Dependabot can see the tag and find newer ones.
  # The Postfix image there is built from test/interop/postfix (see above).
  - package-ecosystem: docker-compose
    directory: /test/interop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns:
          - "*"

name: Release

# Builds and publishes a release for every tag that starts with "v", such as
# v0.1.0. It never runs for a pull request.
#
# Normally release-please (release-please.yml) pushes the tag when its release
# pull request is merged, and creates a draft release for it at the same time.
# GoReleaser uploads the files into that draft and publishes it. A tag pushed
# by hand works too: then GoReleaser creates the release.
#
# What it publishes (see .goreleaser.yaml):
#   - a GitHub release with the archives of five platforms, one SBOM per
#     archive, checksums.txt and its cosign signature bundle;
#   - the Homebrew cask in github.com/EmadMokhtar/homebrew-tap;
#   - the container image ghcr.io/emadmokhtar/email-mcp;
#   - GitHub build-provenance attestations for every file in checksums.txt
#     and for the image.
#
# It needs one secret, HOMEBREW_TAP_GITHUB_TOKEN: a token that may push to the
# tap repository (see the README, "Making a release").
on:
  push:
    tags:
      - "v*"

# Read-only by default. Only the release job gets write permissions, and only
# the ones it needs.
permissions:
  contents: read

# Never run two releases of the same tag at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned by full commit SHA. The comment after the SHA is the
# release tag. To update an action, look up the SHA of the new tag first. The
# tool versions (GoReleaser, cosign, Syft, govulncheck) are pinned too.
#
# No step puts a ${{ }} value into a "run:" script. Values from the event go
# through "env:" and are used as quoted shell variables.

jobs:
  check:
    name: vet, test and govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # No module cache: a release never uses files that another workflow
          # run wrote.
          cache: false
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      # Known vulnerabilities in the dependencies or the standard library stop
      # the release. Keep the version the same as in ci.yml and the Makefile.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # server.json (the MCP Registry entry) must name the version of this tag.
      - name: server.json version matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#v}"
          got="$(jq -r .version server.json)"
          if [ "$got" != "$want" ]; then
            echo "server.json has version $got, but the tag needs $want. A tag cannot be moved or deleted (ruleset \"release tags\"), so fix server.json on main and release the next version." >&2
            exit 1
          fi

  release:
    name: GoReleaser
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A deployment environment. Keep HOMEBREW_TAP_GITHUB_TOKEN as a secret of
    # this environment, and allow only tags v* to deploy to it: then no other
    # workflow or branch can read the token (see the README).
    environment: release
    permissions:
      contents: write # create the GitHub release and upload its files
      packages: write # push the image to GHCR
      id-token: write # get the OIDC token for cosign keyless signing and the attestations
      attestations: write # store the build-provenance attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the full history and the tags for the changelog.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The version that this installer release checks against its own
          # list of hashes.
          cosign-release: v3.0.6
      - name: install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          # The default version of this sbom-action release.
          syft-version: v1.54.0
      # Buildx with the docker-container driver can build both image platforms
      # in one run and attach an SBOM to the image. The release stage of the
      # Dockerfile only copies files, so no emulator (QEMU) is needed.
      # The builder (BuildKit) runs as a container. Without driver-opts it is
      # moby/buildkit:buildx-stable-1, a tag that moves, and it builds the
      # published image. So it is pinned to one version by digest. Dependabot
      # does not see this line: update it by hand with
      #   docker buildx imagetools inspect moby/buildkit:<version>
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Keep the same version as in the comment of .goreleaser.yaml.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Check the signature the same way the README tells users to check it.
      - name: verify the signature of checksums.txt
        env:
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      # One attestation for every file in checksums.txt: the archives and the
      # SBOMs.
      - name: attest the release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # GoReleaser lists the pushed image in dist/artifacts.json. Every tag of
      # the image points to the same multi-platform index, so there must be
      # exactly one digest.
      - name: find the image digest
        id: image
        run: |
          digests="$(jq -r '[.[] | select(.type == "Docker Image") | .extra.Digest] | unique | .[]' dist/artifacts.json)"
          if [ "$(printf '%s\n' "$digests" | grep -c '^sha256:')" -ne 1 ]; then
            echo "expected exactly one image digest in dist/artifacts.json, got: $digests" >&2
            exit 1
          fi
          echo "digest=$digests" >> "$GITHUB_OUTPUT"
      - name: attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/emadmokhtar/email-mcp
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for repositories of an organization.
          # This repository belongs to a user.
          create-storage-record: false

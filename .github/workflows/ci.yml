name: CI

on:
  push:
  pull_request:

# Read-only token. No job in this file needs to write to the repository.
permissions:
  contents: read

# Every action is pinned by full commit SHA. The comment after the SHA is the
# release tag. To update an action, look up the SHA of the new tag first.
#
# The tool versions below (staticcheck, govulncheck) must match the Makefile.

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: go vet
        run: go vet ./...
      # The interop test needs Docker to run, so it runs nightly in
      # interop.yml. Here it is only vetted, so a change that breaks it shows
      # up at once.
      - name: go vet (interop tag)
        run: go vet -tags interop ./test/interop/
      - name: go test
        run: go test -race ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags interop ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.13.2 uses golang.org/x/tools v0.49.0, which cannot read the
          # export data of the Go 1.27.3 standard library, so every import
          # failed with a typecheck error. v2.15.0 uses x/tools v0.52.0.
          version: v2.15.0
          # Build golangci-lint with the Go of this job, the same way as a
          # local "go run", so its type checker always knows that Go.
          install-mode: goinstall

  # Check .goreleaser.yaml on every pull request. Otherwise a bad key shows up
  # only in release.yml, after the release tag exists, and a tag cannot be
  # moved. This is its own job with no Go setup: "goreleaser check" needs no
  # Go, and a job that runs GoReleaser must not restore a cache (zizmor,
  # cache-poisoning). Keep the version the same as in release.yml.
  goreleaser:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

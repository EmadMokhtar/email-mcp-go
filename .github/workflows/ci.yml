name: CI

# A push to a branch with an open pull request starts both events. Without
# the branch filter on push, every job ran twice for one commit. The
# pull_request run is the useful one: it tests the branch merged into the
# current main. The push run on main stays, because the main ruleset does not
# require a branch to be up to date before merge. Two pull requests can each
# pass alone and still break main together, and this run finds that.
on:
  push:
    branches:
      - main
  pull_request:

# Read-only token. No job in this file needs to write to the repository.
permissions:
  contents: read

# Every action is pinned by full commit SHA. The comment after the SHA is the
# release tag. To update an action, look up the SHA of the new tag first.
#
# The tool versions below (staticcheck, govulncheck) must match the Makefile.

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      # One go vet has every build tag and every package, so a new package
      # with a tag is vetted without a change here. The interop test needs
      # Docker to run, so it runs nightly in interop.yml. The tests with the
      # screenshots tag need Chrome, and the tests with the sitebuild tag need
      # the table fixtures. "make site" runs both. Here they are only vetted,
      # so a change that breaks them shows up at once.
      - name: go vet
        run: go vet -tags interop,screenshots,sitebuild ./...
      # "make test" runs every package with -race, then the packages of
      # NORACE_PKGS in the Makefile again without it. See the Makefile for why.
      - name: make test
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -tags interop,screenshots,sitebuild ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.13.2 uses golang.org/x/tools v0.49.0, which cannot read the
          # export data of the Go 1.27.3 standard library, so every import
          # failed with a typecheck error. v2.15.0 uses x/tools v0.52.0.
          version: v2.15.0
          # Build golangci-lint with the Go of this job, the same way as a
          # local "go run", so its type checker always knows that Go.
          install-mode: goinstall

  # Check .goreleaser.yaml on every pull request. Otherwise a bad key shows up
  # only in release.yml, after the release tag exists, and a tag cannot be
  # moved. This is its own job with no Go setup: "goreleaser check" needs no
  # Go, and a job that runs GoReleaser must not restore a cache (zizmor,
  # cache-poisoning). Keep the version the same as in release.yml.
  goreleaser:
    name: goreleaser check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Build the docs site on every pull request, with the same "make site" as
  # pages.yml. It makes the screenshots with Chrome (the Ubuntu runner has it),
  # builds the site with Hugo, and runs the site check. There is no path
  # filter on purpose: a required check that does not run blocks the merge
  # forever. Hugo runs through "go run" (see the Makefile), so the Go checksum
  # database verifies it and the job downloads no release file.
  site:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: make site
        run: make site
      # The images are not in git. A reviewer opens this artifact to see how
      # the pages look after the change. The step also runs when "make site"
      # failed, because the images that were made before the failure help to
      # find the cause. Nothing is uploaded when the run stopped before the
      # first image.
      - name: upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: site/assets/screenshots
          retention-days: 7
          if-no-files-found: ignore
